input {
  http_poller {
    urls => {
      "co_atc_api" => {
        method => "get"
        url => "http://co-atc:8000/api/v1/aircraft?status=active&lastSeenMinutes=5"
        headers => {
          "Accept" => "application/json"
        }
      }
    }
    request_timeout => 10
    schedule => { every => "5s" }
    codec => "json"
    ecs_compatibility => "v8"
    tags => ["co-atc-api"]
  }
}

filter {
  # 1. Separar cada avión en un evento único
  if [aircraft] {
    split { field => "[aircraft]" }
  }

  # 2. Gestión del Tiempo
  date {
    match => [ "[aircraft][last_seen]", "ISO8601" ]
    target => "@timestamp"
    timezone => "UTC"
  }

  # 3. RENOMBRAMIENTO MASIVO (Nuevos campos añadidos)
  mutate {
    rename => {
      "[aircraft][hex]" => "id_icao"
      "[aircraft][flight]" => "callsign_vuelo"
      "[aircraft][adsb][r]" => "matricula_aeronave"
      "[aircraft][adsb][t]" => "modelo_aeronave"
      "[aircraft][airline]" => "aerolinea"

      "[aircraft][status]" => "estado"
      "[aircraft][on_ground]" => "en_tierra"
      "[aircraft][phase][current][0][phase]" => "fase_vuelo"
      "[aircraft][date_tookoff]" => "hora_despegue"
      "[aircraft][date_landed]" => "hora_aterrizaje"

      "[aircraft][adsb][lat]" => "latitud"
      "[aircraft][adsb][lon]" => "longitud"
      "[aircraft][adsb][track]" => "rumbo_real"
      "[aircraft][adsb][mag_heading]" => "rumbo_magnetico"
      "[aircraft][distance]" => "distancia_receptor_nm"

      "[aircraft][adsb][alt_baro]" => "altitud_pies"
      "[aircraft][adsb][alt_geom]" => "altitud_geometrica_pies"
      "[aircraft][adsb][baro_rate]" => "tasa_vertical_pies_min"
      "[aircraft][adsb][nav_altitude_mcp]" => "altitud_objetivo_piloto"

      "[aircraft][adsb][gs]" => "velocidad_tierra_nudos"
      "[aircraft][adsb][ias]" => "velocidad_indicada"
      "[aircraft][adsb][tas]" => "velocidad_verdadera"
      "[aircraft][adsb][mach]" => "numero_mach"
      "[aircraft][adsb][roll]" => "angulo_alabeo"

      "[aircraft][adsb][rssi]" => "intensidad_senal_rssi"
      "[aircraft][adsb][nic]" => "integridad_navegacion_nic"
      "[aircraft][adsb][nac_p]" => "precision_posicion_nacp"
      "[aircraft][adsb][squawk]" => "codigo_transpondedor"
      "[aircraft][adsb][category]" => "categoria_estela"
    }
  }

  # 4. Creación del objeto geoespacial
  if [latitud] and [longitud] {
    mutate {
      add_field => { "[location]" => "%{latitud},%{longitud}" }
    }
  }

  # 5. CONVERSIÓN DE TIPOS (Para que Kibana no se queje)
  mutate {
    convert => {
      "latitud" => "float"
      "longitud" => "float"
      "altitud_pies" => "float"
      "altitud_geometrica_pies" => "float"
      "altitud_objetivo_piloto" => "integer"
      "velocidad_tierra_nudos" => "float"
      "velocidad_indicada" => "float"
      "velocidad_verdadera" => "float"
      "numero_mach" => "float"
      "rumbo_real" => "float"
      "rumbo_magnetico" => "float"
      "angulo_alabeo" => "float"
      "tasa_vertical_pies_min" => "float"
      "intensidad_senal_rssi" => "float"
      "distancia_receptor_nm" => "float"
      "distancia_receptor_km" => "float"
      "dif_altitud_baro_geom" => "float"
      "dif_rumbo_grados" => "float"
      "dif_tasa_vertical" => "float"

      "integridad_navegacion_nic" => "integer"
      "precision_posicion_nacp" => "integer"

      "en_tierra" => "boolean"
    }
  }

  # 6. REGLAS SIEM (Etiquetado de Anomalías)
  ruby {
    init => "@@last_vr ||= {}"
    code => "
      dist_nm = event.get('distancia_receptor_nm')
      if dist_nm
        event.set('distancia_receptor_km', dist_nm.to_f * 1.852)
      end

      v_tierra = event.get('velocidad_tierra_nudos')
      if v_tierra && v_tierra.to_f > 1200
        event.tag('alerta_velocidad_excesiva')
      end

      alt = event.get('altitud_pies')
      ias = event.get('velocidad_indicada')
      if alt && ias && alt.to_f < 10000 && ias.to_f > 260
        event.tag('alerta_velocidad_baja_cota')
      end

      if alt && alt.to_f < -100
        en_tierra = event.get('en_tierra')
        if en_tierra == false || en_tierra.nil?
          event.tag('alerta_altitud_negativa')
        end
      end

      rssi = event.get('intensidad_senal_rssi')
      nic = event.get('integridad_navegacion_nic')
      if rssi && nic && rssi.to_f > -10.0 && nic.to_i < 6
        event.tag('posible_spoofing')
      end

      squawk = event.get('codigo_transpondedor')
      if squawk
        s = squawk.to_s
        if ['7500', '7600', '7700'].include?(s)
          event.tag('alerta_emergencia_aerea')
        end
      end

      vr = event.get('tasa_vertical_pies_min')
      if vr
        v = vr.to_f
        if v > 8000 || v < -8000
          event.tag('alerta_tasa_vertical_extrema')
        end
      end

      alt_baro = event.get('altitud_pies')
      alt_geom = event.get('altitud_geometrica_pies')
      if alt_baro && alt_geom
        diff = (alt_baro.to_f - alt_geom.to_f).abs
        event.set('dif_altitud_baro_geom', diff)
        if diff > 3000
          event.tag('alerta_baro_geom_desfase')
        end
      end

      track = event.get('rumbo_real')
      heading = event.get('rumbo_magnetico')
      if track && heading
        delta = (track.to_f - heading.to_f).abs % 360
        delta = 360 - delta if delta > 180
        event.set('dif_rumbo_grados', delta)
        if delta > 60
          event.tag('alerta_deriva_imposible')
        end
      end

      rssi = event.get('intensidad_senal_rssi')
      if dist_nm && rssi && dist_nm.to_f >= 200 && rssi.to_f >= -5
        event.tag('alerta_rssi_distancia_incoherente')
      end

      id = event.get('id_icao')
      vr = event.get('tasa_vertical_pies_min')
      if id && !vr.nil?
        prev = @@last_vr[id]
        if !prev.nil?
          delta = (vr.to_f - prev.to_f).abs
          event.set('dif_tasa_vertical', delta)
          if delta >= 10000
            event.tag('alerta_tasa_vertical_inestable')
          end
        end
        @@last_vr[id] = vr
      end
    "
  }

  # 7. DEDUPLICACIÓN
  ruby {
    init => "@@last_state ||= {}"
    code => "
      id = event.get('id_icao')
      if id
        estado_actual = [
          event.get('latitud'),
          event.get('longitud'),
          event.get('altitud_pies'),
          event.get('altitud_geometrica_pies'),
          event.get('velocidad_tierra_nudos'),
          event.get('velocidad_verdadera'),
          event.get('rumbo_real'),
          event.get('rumbo_magnetico'),
          event.get('velocidad_indicada'),
          event.get('numero_mach'),
          event.get('tasa_vertical_pies_min'),
          event.get('intensidad_senal_rssi'),
          event.get('integridad_navegacion_nic'),
          event.get('precision_posicion_nacp'),
          event.get('codigo_transpondedor'),
          event.get('[aircraft][last_seen]')
        ].map { |v| v.nil? ? 'nil' : v.to_s }.join('|')

        if @@last_state[id] == estado_actual
          event.cancel
        else
          @@last_state[id] = estado_actual
        end
      end
    "
  }

  # 8. LIMPIEZA FINAL
  mutate {
    remove_field => [
      "[event][original]", "event", "aircraft", "count", "counts",
      "now", "timestamp", "headers", "@version", "host",
      "[adsb]", "[phase]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "adsb-siem-%{+YYYY.MM.dd}"
  }
  file {
    path => "/logs/adsb_siem_events.log"
    codec => json_lines
    create_if_deleted => true
  }
}
