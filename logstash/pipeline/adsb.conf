input {
  beats {
    port => 5044
  }
}

filter {
  # Descarta líneas que no se parsearon como JSON en Filebeat.
  if [error] {
    drop { }
  }

  # Normaliza tipos numéricos si existen.
  mutate {
    convert => {
      "lat" => "float"
      "lon" => "float"
      "altitude" => "integer"
      "speed" => "integer"
      "heading" => "float"
      "vertical_rate" => "float"
    }
  }

  # Construye el geo_point para mapas.
  if [lat] and [lon] {
    mutate {
      add_field => {
        "[location][lat]" => "%{lat}"
        "[location][lon]" => "%{lon}"
      }
    }
    mutate {
      convert => {
        "[location][lat]" => "float"
        "[location][lon]" => "float"
      }
    }
  }

  # Opcional: interpreta timestamp si viene como string.
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
    }
  }

  # Etiqueta eventos sin posición para distinguirlos en Kibana.
  if !([lat] and [lon]) {
    mutate { add_tag => ["sin_geo"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "adsb-data-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
