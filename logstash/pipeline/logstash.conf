input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][source_type] == "co-atc-log" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:co_ts}\t%{GREEDYDATA:co_level_color}\t%{NOTSPACE:co_component}\t%{DATA:co_event}\t%{GREEDYDATA:co_payload}"
      }
      tag_on_failure => ["grok_coatc_fail"]
    }
    mutate {
      rename => { "co_ts" => "@timestamp" }
      rename => { "co_level_color" => "level" }
      rename => { "co_component" => "component" }
      rename => { "co_event" => "event" }
    }
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
    if [co_payload] {
      json {
        source => "co_payload"
        target => "payload"
        remove_field => ["co_payload"]
      }
    }
    prune {
      whitelist_names => ["^@timestamp$", "^level$", "^component$", "^event$", "^payload", "^source_type$", "^host$"]
    }
  } else if [fields][source_type] == "adsb" {
    json { source => "message" target => "adsb" remove_field => ["message"] }
    mutate {
      rename => {
        "[adsb][hex]" => "hex"
        "[adsb][flight]" => "flight"
        "[adsb][lat]" => "lat"
        "[adsb][lon]" => "lon"
        "[adsb][alt_baro]" => "alt_baro"
        "[adsb][alt_geom]" => "alt_geom"
        "[adsb][gs]" => "gs"
        "[adsb][heading]" => "heading"
        "[adsb][vertical_rate]" => "vertical_rate"
      }
    }
    mutate {
      convert => {
        "lat" => "float"
        "lon" => "float"
        "alt_baro" => "float"
        "alt_geom" => "float"
        "gs" => "float"
        "heading" => "float"
        "vertical_rate" => "float"
      }
    }
    prune {
      whitelist_names => ["^hex$", "^flight$", "^lat$", "^lon$", "^alt_baro$", "^alt_geom$", "^gs$", "^heading$", "^vertical_rate$", "^source_type$", "^@timestamp$"]
    }
  }
}

output {
  if [fields][source_type] == "co-atc-log" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "co-atc-logs-%{+YYYY.MM.dd}"
    }
    file {
      path => "/logs/co_atc_parsed.log"
      codec => json_lines
      create_if_deleted => true
    }
  } else if [fields][source_type] == "adsb" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "adsb-data-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "misc-logs-%{+YYYY.MM.dd}"
    }
  }
}
