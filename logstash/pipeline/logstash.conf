input {
  http_poller {
    urls => {
      "co_atc_api" => {
        method => "get"
        url => "http://co-atc:8000/api/v1/aircraft?status=active&lastSeenMinutes=5"
        headers => {
          "Accept" => "application/json"
        }
      }
    }
    request_timeout => 10
    schedule => { every => "5s" }
    codec => "json"
    ecs_compatibility => "v8"
    tags => ["co-atc-api"]
  }
}

filter {
  # 1. Separar cada avión en un evento único
  if [aircraft] {
    split { field => "[aircraft]" }
  }

  # 2. Gestión del Tiempo
  date {
    match => [ "[aircraft][last_seen]", "ISO8601" ]
    target => "@timestamp"
    timezone => "UTC"
  }

# 3. RENOMBRAMIENTO MASIVO (Nuevos campos añadidos)
  mutate {
    rename => {
      "[aircraft][hex]" => "id_icao"                
      "[aircraft][flight]" => "callsign_vuelo"     
      "[aircraft][adsb][r]" => "matricula_aeronave" 
      "[aircraft][adsb][t]" => "modelo_aeronave"   
      "[aircraft][airline]" => "aerolinea"

      "[aircraft][status]" => "estado"
      "[aircraft][on_ground]" => "en_tierra"
      "[aircraft][is_simulated]" => "es_simulado"
      "[aircraft][phase][current][0][phase]" => "fase_vuelo" 
      "[aircraft][date_tookoff]" => "hora_despegue"
      "[aircraft][date_landed]" => "hora_aterrizaje"

      "[aircraft][adsb][lat]" => "latitud"
      "[aircraft][adsb][lon]" => "longitud"
      "[aircraft][adsb][track]" => "rumbo_real"        
      "[aircraft][adsb][mag_heading]" => "rumbo_magnetico" 
      "[aircraft][distance]" => "distancia_receptor_km" 

      "[aircraft][adsb][alt_baro]" => "altitud_pies"
      "[aircraft][adsb][alt_geom]" => "altitud_geometrica_pies" 
      "[aircraft][adsb][baro_rate]" => "tasa_vertical_pies_min" 
      "[aircraft][adsb][nav_altitude_mcp]" => "altitud_objetivo_piloto" 

      "[aircraft][adsb][gs]" => "velocidad_tierra_nudos" 
      "[aircraft][adsb][ias]" => "velocidad_indicada"
      "[aircraft][adsb][tas]" => "velocidad_verdadera"
      "[aircraft][adsb][mach]" => "numero_mach"
      "[aircraft][adsb][roll]" => "angulo_alabeo"
      
      "[aircraft][adsb][rssi]" => "intensidad_senal_rssi"
      "[aircraft][adsb][nic]" => "integridad_navegacion_nic"
      "[aircraft][adsb][nac_p]" => "precision_posicion_nacp"
      "[aircraft][adsb][squawk]" => "codigo_transpondedor"
      "[aircraft][adsb][spi]" => "flag_ident_pulsado"
      "[aircraft][adsb][alert]" => "flag_alerta_cockpit"
      "[aircraft][adsb][category]" => "categoria_estela"
    }
  }

  # 4. Creación del objeto geoespacial
  if [latitud] and [longitud] {
    mutate {
      add_field => { "[location]" => "%{latitud},%{longitud}" }
    }
  }

  # 5. CONVERSIÓN DE TIPOS (Para que Kibana no se queje)
  mutate {
    convert => {
      "latitud" => "float"
      "longitud" => "float"
      "altitud_pies" => "float"
      "altitud_geometrica_pies" => "float"
      "altitud_objetivo_piloto" => "integer"
      "velocidad_tierra_nudos" => "float"
      "velocidad_indicada" => "float"
      "velocidad_verdadera" => "float"
      "numero_mach" => "float"
      "rumbo_real" => "float"
      "rumbo_magnetico" => "float"
      "angulo_alabeo" => "float"
      "tasa_vertical_pies_min" => "float"
      "intensidad_senal_rssi" => "float"
      "distancia_receptor_km" => "float"
      
      "integridad_navegacion_nic" => "integer"
      "precision_posicion_nacp" => "integer"
      
      "en_tierra" => "boolean"
      "es_simulado" => "boolean"
      "flag_ident_pulsado" => "boolean"
      "flag_alerta_cockpit" => "boolean"
    }
  }

  # 6. REGLAS SIEM (Etiquetado de Anomalías)

  # Regla A: Velocidad Imposible (> 1200 kts GS)
  if [velocidad_tierra_nudos] and [velocidad_tierra_nudos] > 1200 {
    mutate { add_tag => ["alerta_velocidad_excesiva"] }
  }

  # Regla B: Exceso de velocidad bajo 10.000 pies (> 250 IAS)
  # Esta es la regla normativa real que buscabas
  if [altitud_pies] and [velocidad_indicada] {
    if [altitud_pies] < 10000 and [velocidad_indicada] > 260 { # Margen de 10 kts
      mutate { add_tag => ["alerta_velocidad_baja_cota"] }
    }
  }

  # Regla C: Altitud Negativa en Vuelo
  if [altitud_pies] and [altitud_pies] < -100 and ![en_tierra] {
    mutate { add_tag => ["alerta_altitud_negativa"] }
  }

  # Regla D: Spoofing (Señal fuerte + Datos basura)
  if [intensidad_senal_rssi] and [intensidad_senal_rssi] > -10.0 and [integridad_navegacion_nic] and [integridad_navegacion_nic] < 6 {
    mutate { add_tag => ["posible_spoofing"] }
  }
  
  # Regla E: Emergencias (Squawk Codes)
  if [codigo_transpondedor] in ["7500", "7600", "7700"] {
    mutate { add_tag => ["alerta_emergencia_aerea"] }
  }

  # 7. DEDUPLICACIÓN
  ruby {
    init => "@@last_state ||= {}"
    code => "
      id = event.get('id_icao')
      if id
        # Firma de estado ampliada con nuevos campos
        estado_actual = [
          event.get('latitud'),
          event.get('longitud'),
          event.get('altitud_pies'),
          event.get('velocidad_tierra_nudos'),
          event.get('rumbo_real'),
          event.get('velocidad_indicada') # Importante si cambia la IAS
        ].map { |v| v.nil? ? 'nil' : v.to_s }.join('|')
        
        if @@last_state[id] == estado_actual
          event.cancel
        else
          @@last_state[id] = estado_actual
        end
      end
    "
  }

# 8. LIMPIEZA FINAL
  mutate {
    remove_field => [
      "[event][original]", "event", "aircraft", "count", "counts", 
      "now", "timestamp", "headers", "@version", "host",
      "[adsb]", "[phase]" 
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "adsb-siem-%{+YYYY.MM.dd}"
  }
  file {
    path => "/logs/adsb_siem_events.log"
    codec => json_lines
    create_if_deleted => true
  }
  # stdout { codec => rubydebug }
}
