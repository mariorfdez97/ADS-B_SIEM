input {
  beats {
    port => 5044
  }
  http {
    port => 5045
    codec => json
  }
}

filter {
  mutate {
    convert => {
      "lat"           => "float"
      "lon"           => "float"
      "altitude"      => "float"
      "velocidad"     => "float"
      "velocity"      => "float"
      "vertical_rate" => "float"
    }
  }

  # Normalizar timestamp si viene en el campo "timestamp"
  date {
    match  => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_timestamp_parse_failure"]
  }

  # Construir geo_point para Kibana
  ruby {
    code => "
      lat = event.get('lat') || event.get('latitude')
      lon = event.get('lon') || event.get('longitude')
      if lat && lon
        event.set('location', {'lat' => lat.to_f, 'lon' => lon.to_f})
      end
    "
  }

  # Etiquetar escenario si no viene definido
  if ![scenario] {
    mutate { add_field => { "scenario" => "default" } }
  }

  # Limpiar ruido del input HTTP
  if [headers] {
    mutate { remove_field => ["headers", "host"] }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "${ELASTIC_USER:elastic}"
    password => "${ELASTIC_PASSWORD:changeme}"
    index    => "adsb-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
