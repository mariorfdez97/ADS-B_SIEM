filebeat.inputs:
  - type: log
    id: co-atc-log
    enabled: true
    paths:
      - /logs/co_atc.log
    fields:
      source_type: co-atc-log
    fields_under_root: true

  # Ejemplo opcional para ingestar aircraft.json via httpjson (comenta si no se usa)
