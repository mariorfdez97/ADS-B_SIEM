version: "3.8"

services:
  adsb-feed:
    build:
      context: ./services/adsb-feed
    restart: unless-stopped
    volumes:
      - aircraft_data:/data
    ports:
      - "9000:9000"

  co-atc:
    build:
      context: ./co-atc-main
    restart: unless-stopped
    depends_on:
      - adsb-feed
    environment:
      - COATC_CONFIG=/app/configs/config.docker.toml
    volumes:
      - ./co-atc-main/configs/config.docker.toml:/app/configs/config.docker.toml:ro
      - coatc_data:/app/data
    ports:
      - "8000:8000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.1
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
      co-atc:
        condition: service_started
    user: root
    command: ["-w", "1"]
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs
    ports:
      - "5044:5044"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/pipelines || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  esdata:
  coatc_data:
  aircraft_data:
